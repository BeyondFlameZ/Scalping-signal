name: scalp-lab

on:
  workflow_dispatch:
    inputs:
      costs_only:
        description: "Только пол издержек (быстро, ~2 мин)"
        type: boolean
        default: true
      days:
        description: "Дней истории"
        type: string
        default: "30"
      interval:
        description: "Таймфрейм, минут"
        type: choice
        default: "1"
        options: ["1", "3", "5", "15"]
      entry:
        description: "Модель входа"
        type: choice
        default: "taker"
        options: ["taker", "maker"]
      symbols:
        description: "Пары через запятую"
        type: string
        default: "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,BNBUSDT,AVAXUSDT,LINKUSDT"
      strategy:
        description: "Одна стратегия (пусто = все)"
        type: string
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Прогон стенда
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAYS: ${{ inputs.days }}
          INTERVAL: ${{ inputs.interval }}
          ENTRY: ${{ inputs.entry }}
          SYMBOLS: ${{ inputs.symbols }}
          COSTS_ONLY: ${{ inputs.costs_only && '1' || '0' }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          set -o pipefail
          if [ -n "$STRATEGY" ]; then
            python3 scalp_lab.py --strategy "$STRATEGY" 2>&1 | tee run.log
          else
            python3 scalp_lab.py 2>&1 | tee run.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalp-lab-log
          path: run.log
          retention-days: 14
